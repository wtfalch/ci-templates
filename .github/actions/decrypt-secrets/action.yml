name: Decrypt SOPS+age secrets
description: >-
  Installs sops if missing, then decrypts a SOPS-encrypted dotenv file using
  SOPS_AGE_KEY (must be in env, typically from a GH repo secret). Writes the
  decrypted content to <output-file>; subsequent workflow steps `source` it
  to load env vars, or read it directly.
#
# Why a composite action and not just inline `sops -d` in each workflow:
#   - centralizes the install-if-missing dance (sops isn't on every runner)
#   - one place to update the version pin
#   - lets caller workflows invoke it as a single `uses:` step
#
# sops-version and sops-sha256 are bumped together. The hash is the
# linux/amd64 entry from that version's own
# https://github.com/getsops/sops/releases/download/v<version>/sops-v<version>.checksums.txt
# — not invented here, just pinned so a corrupted or substituted download
# fails the install instead of being handed the decryption key.
#
# Caller pattern:
#   - uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
#     with:
#       env-file: secrets/prod.env
#       output-file: .env
#     env:
#       SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

inputs:
  env-file:
    description: Path to the SOPS-encrypted dotenv file in the checked-out repo
    required: true
  output-file:
    description: Path to write decrypted content to
    default: .env
  sops-version:
    description: Pinned sops version (only used if sops isn't already on PATH)
    default: '3.9.4'
  sops-sha256:
    description: >-
      Expected sha256 of sops-v<sops-version>.linux.amd64, from that
      release's own checksums.txt. Bump together with sops-version.
    default: '5488e32bc471de7982ad895dd054bbab3ab91c417a118426134551e9626e4e85'

runs:
  using: composite
  steps:
    - name: Install sops (if missing)
      shell: bash
      run: |
        if command -v sops >/dev/null 2>&1; then
          echo "sops $(sops --version | head -1) already installed"
          exit 0
        fi
        VERSION="${{ inputs.sops-version }}"
        URL="https://github.com/getsops/sops/releases/download/v${VERSION}/sops-v${VERSION}.linux.amd64"
        curl -fsSL "$URL" -o /tmp/sops
        echo "${{ inputs.sops-sha256 }}  /tmp/sops" | sha256sum -c -
        sudo install -m 0755 /tmp/sops /usr/local/bin/sops
        rm /tmp/sops
        echo "installed sops $(sops --version | head -1)"

    - name: Verify SOPS_AGE_KEY is present
      shell: bash
      run: |
        if [ -z "${SOPS_AGE_KEY:-}" ]; then
          echo "::error::SOPS_AGE_KEY env var is empty. Set it from secrets.SOPS_AGE_KEY on the calling job."
          exit 1
        fi

    - name: Decrypt
      shell: bash
      run: |
        if [ ! -f "${{ inputs.env-file }}" ]; then
          echo "::error::encrypted file not found: ${{ inputs.env-file }}"
          exit 1
        fi
        # The encrypted file is dotenv-formatted; preserve the format on the way out.
        sops --decrypt --input-type dotenv --output-type dotenv \
          --output "${{ inputs.output-file }}" \
          "${{ inputs.env-file }}"
        echo "::notice::decrypted ${{ inputs.env-file }} → ${{ inputs.output-file }}"
