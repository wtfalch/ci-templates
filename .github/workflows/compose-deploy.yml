name: Compose deploy

# Reusable workflow that ships the consumer repo's docker-compose.yml to the
# LXC and applies it. Caller workflows trigger this on push-to-main when
# docker-compose.yml changes.
#
# Why this exists: the prod compose lives at /opt/stack/{app}/docker-compose.yml
# on the LXC. It was originally written by `bootstrap/07-lxc-stack.ts` at
# bootstrap time, then hand-edited as needed. Hand-editing leaves the LXC and
# the repo drifting and means small infra changes (Caddy label, env tweak,
# image bump) need SSH access. Treating docker-compose.yml in the app repo as
# the source of truth + this workflow shipping it on push closes the loop:
#
#   1. Edit docker-compose.yml in the app repo.
#   2. PR diff shows exactly what changes on the LXC.
#   3. On merge: workflow validates the new file, backs up the live one,
#      atomically swaps, then `docker compose up -d --remove-orphans`
#      reconciles. Compose recreates only services whose image / env /
#      networks / labels changed; the rest stay running.
#
# Out of scope: building images (deploy.yml does that), running migrations.
#
# .env handling (was previously out of scope): if the caller passes
# `sops-prod-env-file`, the workflow decrypts that sops file and ships
# the rendered .env alongside docker-compose.yml in the same atomic
# swap. Without that input, .env on the LXC stays operator-managed
# (the original behavior — keep this default for repos that haven't
# adopted sops for prod yet).

on:
  workflow_call:
    inputs:
      app-name:
        description: App slug — used for the compose project at /opt/stack/{app}.
        type: string
        required: true
      service:
        description: |
          Optional: limit recreation to a single service. Useful when you
          changed labels on one container only and want to avoid touching
          others. Defaults to empty (full `up -d --remove-orphans`).
        type: string
        required: false
        default: ''
      sops-prod-env-file:
        description: |
          Optional: path in the caller repo to a sops-encrypted dotenv
          file. When set, the workflow decrypts it and writes the
          result to /opt/stack/{app}/.env on the LXC as part of the
          same atomic swap as docker-compose.yml. Requires the
          SOPS_AGE_KEY secret to be passed too. When unset, the
          existing .env on the LXC is untouched.
        type: string
        required: false
        default: ''
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      SOPS_AGE_KEY:
        required: false
        description: |
          age private key for decrypting sops-prod-env-file. Required
          only if that input is set; ignored otherwise.

permissions:
  contents: read

# One compose deploy at a time per app. Two pushes racing `docker compose up`
# would interleave container recreates and leave the stack indeterminate.
concurrency:
  group: compose-deploy-${{ inputs.app-name }}
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml present
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "::error::docker-compose.yml missing at repo root. This workflow ships that file to /opt/stack/${{ inputs.app-name }}/ on the LXC."
            exit 1
          fi
          echo "compose file size: $(wc -c < docker-compose.yml) bytes"

      # Optional: decrypt the prod sops env file so it ships alongside
      # the compose file in the same atomic swap below. Skipped when the
      # caller didn't pass the input (back-compat for apps that still
      # operator-manage their .env on the LXC).
      - name: Decrypt sops prod env (optional)
        if: inputs.sops-prod-env-file != ''
        uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-prod-env-file }}
          output-file: /tmp/render.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ship compose + apply
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
          SERVICE: ${{ inputs.service }}
          SHIP_ENV: ${{ inputs.sops-prod-env-file != '' && '1' || '' }}
        run: |
          set -euo pipefail
          STACK_DIR="/opt/stack/${APP_NAME}"

          # Build the tar payload. Always includes docker-compose.yml.
          # When SHIP_ENV is set (caller provided sops-prod-env-file),
          # the decrypted .env from /tmp/render.env is bundled alongside
          # under the name `prod.env.new` so the remote can swap it in
          # atomically with the compose file. Keeping the file naming
          # explicit (`prod.env.new`) avoids confusing a partially-
          # transferred tar with the live `.env`.
          if [ -n "${SHIP_ENV}" ]; then
            cp /tmp/render.env prod.env.new
            chmod 600 prod.env.new
            TAR_PAYLOAD="docker-compose.yml prod.env.new"
          else
            TAR_PAYLOAD="docker-compose.yml"
          fi

          # Pipe the bundle as a tar to ssh's stdin. The whole remote
          # script is passed as ssh's command argument (NOT via `bash -s`
          # heredoc, which would consume stdin and leave nothing for the
          # remote `tar -xf -`). Variables are interpolated locally; the
          # script itself uses single-quotes wherever possible to keep
          # remote-shell escaping minimal.
          #
          # Validation: `docker compose config -q` against the NEW .env
          # (if one is being shipped) or the LIVE .env (when keeping the
          # operator-managed file). Atomic swap via mv only happens after
          # validation passes; on any failure before the swap, the live
          # files are untouched.
          # shellcheck disable=SC2086
          tar -cf - ${TAR_PAYLOAD} | \
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
              "${SSH_USER}@${HOST}" \
              "set -euo pipefail
               cd '${STACK_DIR}'
               rm -rf .compose-deploy-tmp
               mkdir -p .compose-deploy-tmp
               tar -xf - -C .compose-deploy-tmp
               # Pick the env file the new compose should validate against:
               # the new sops-rendered one when present, otherwise the
               # live .env (back-compat for callers without sops env sync).
               VALIDATE_ENV_FILE='.env'
               if [ -f .compose-deploy-tmp/prod.env.new ]; then
                 VALIDATE_ENV_FILE='.compose-deploy-tmp/prod.env.new'
               fi
               # --project-directory . tells compose to resolve --env-file
               # relative to cwd, then we override with --env-file pointing
               # at whichever file actually carries the variables.
               if ! docker compose -f .compose-deploy-tmp/docker-compose.yml --project-directory . --env-file \"\$VALIDATE_ENV_FILE\" config -q; then
                 echo '::error::compose validation failed; live files left in place'
                 rm -rf .compose-deploy-tmp
                 exit 1
               fi
               # Backup + atomic swap. rm -f the prior .bak first because the
               # deploy user may not own it (manual edits in incidents are
               # often done as root, leaving root-owned .bak files behind);
               # rm only needs write on the parent dir, which deploy has.
               # The .bak files are the one-line rollback handle:
               #   ssh root@lxc 'cd /opt/stack/{app}; cp docker-compose.yml.bak docker-compose.yml; cp .env.bak .env; docker compose up -d --remove-orphans'
               rm -f docker-compose.yml.bak
               cp docker-compose.yml docker-compose.yml.bak
               mv .compose-deploy-tmp/docker-compose.yml docker-compose.yml
               if [ -f .compose-deploy-tmp/prod.env.new ]; then
                 rm -f .env.bak
                 # Some apps don't have a live .env yet on first sync.
                 [ -f .env ] && cp .env .env.bak
                 mv .compose-deploy-tmp/prod.env.new .env
                 chmod 600 .env
               fi
               rmdir .compose-deploy-tmp
               # Apply. Compose figures out which services actually changed
               # (image / labels / env / networks / volumes) and recreates
               # only those. --remove-orphans cleans up deleted services.
               if [ -n '${SERVICE}' ]; then
                 docker compose up -d --remove-orphans '${SERVICE}'
               else
                 docker compose up -d --remove-orphans
               fi
               docker compose ps --format 'table {{.Name}}\t{{.Status}}'"

          # Defense in depth: shred the local copy if it landed (the runner
          # is ephemeral, but no reason to leave it sitting in the workspace).
          [ -f prod.env.new ] && shred -u prod.env.new 2>/dev/null || rm -f prod.env.new
          [ -f /tmp/render.env ] && shred -u /tmp/render.env 2>/dev/null || rm -f /tmp/render.env

          echo "::notice::compose deploy applied for ${APP_NAME}"
