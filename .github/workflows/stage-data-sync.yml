name: Stage data sync

# Reusable workflow that snapshots prod's data + schema into stage.
# Triggered by the caller via workflow_dispatch (and optionally cron).
#
# Strategy: pg_dump prod (schema + data) → restore stage. Drops + recreates
# everything in the public + auth schemas. Stage's existing test-state is
# wiped on every run, so don't run this while QA is mid-flow.
#
# Why pg_dump 17: Supabase Cloud is on PostgreSQL 17. pg_dump < server
# version refuses to run with "aborting because of server version mismatch".
# Stock GitHub runners ship pg 14; we install pg 17 from the pgdg apt repo.

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      sops-prod-env-file:
        description: >-
          Path to SOPS-encrypted dotenv whose DATABASE_URL is the prod source
          for the pg_dump. Required.
        type: string
        required: true
      sops-stage-env-file:
        description: >-
          Path to SOPS-encrypted dotenv whose POSTGRES_PASSWORD is the stage
          target's supabase_admin password. Required.
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      SOPS_AGE_KEY:
        description: age private key for decrypting sops-env-file.
        required: true

permissions:
  contents: read

# One sync at a time per app — never two pg_dumps fighting over stage.
concurrency:
  group: stage-data-sync-${{ inputs.app-name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt prod SOPS env (source DATABASE_URL)
        uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-prod-env-file }}
          output-file: /tmp/sops-prod.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Decrypt stage SOPS env (source POSTGRES_PASSWORD)
        uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-stage-env-file }}
          output-file: /tmp/sops-stage.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Source runtime secrets to GITHUB_ENV
        # POSTGRES_PASSWORD lives inside stage.env's DATABASE_URL
        # (postgres://supabase_admin:<PASS>@...). Extract via parameter
        # expansion rather than requiring callers to add a duplicate
        # POSTGRES_PASSWORD field to the encrypted file.
        run: |
          db_url=$(grep '^DATABASE_URL=' /tmp/sops-prod.env | cut -d= -f2-)
          if [ -z "$db_url" ]; then
            echo "::error::DATABASE_URL missing from ${{ inputs.sops-prod-env-file }}"; exit 1
          fi
          stage_db_url=$(grep '^DATABASE_URL=' /tmp/sops-stage.env | cut -d= -f2-)
          if [ -z "$stage_db_url" ]; then
            echo "::error::DATABASE_URL missing from ${{ inputs.sops-stage-env-file }}"; exit 1
          fi
          # Extract password between :supabase_admin: and @ — simple sed,
          # works for any postgres URL whose user is supabase_admin.
          pg_pass=$(printf '%s' "$stage_db_url" | sed -E 's|^postgres(ql)?://[^:]+:([^@]+)@.*$|\2|')
          if [ -z "$pg_pass" ] || [ "$pg_pass" = "$stage_db_url" ]; then
            echo "::error::could not parse password from stage DATABASE_URL"; exit 1
          fi
          echo "::add-mask::${db_url}"
          echo "::add-mask::${pg_pass}"
          {
            echo "PROD_DATABASE_URL=${db_url}"
            echo "STAGE_POSTGRES_PASSWORD=${pg_pass}"
          } >> "$GITHUB_ENV"
          rm /tmp/sops-prod.env /tmp/sops-stage.env

      - name: Install psql 17 + cloudflared
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Ubuntu 24.04 GH runners ship pg 16 client preinstalled. apt
          # leaves /usr/bin/pg_dump pointing at pg 16, which then refuses
          # to run against Supabase Cloud (pg 17): "aborting because of
          # server version mismatch". Prepend pg 17's bindir so subsequent
          # steps resolve pg_dump to the pg 17 binary.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: pg_dump prod → restore stage
        env:
          # PROD_DATABASE_URL + STAGE_POSTGRES_PASSWORD come from SOPS via
          # GITHUB_ENV. The script body uses these var names directly so the
          # rest of the original shape (the heredoc'd SQL) is unchanged.
          PROD_DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
          PREVIEW_POSTGRES_PASSWORD: ${{ env.STAGE_POSTGRES_PASSWORD }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          # auth.users token columns: gotrue 2.158.1 (stage) scans them as
          # non-nullable Go strings; prod has nulls. Patch after restore.
          # SQL is appended to the dump stream before the closing COMMIT.
          # session_replication_role = 'replica' disables triggers + FK
          # checks during the apply. handle_new_user trigger would otherwise
          # try to re-create profile rows on every auth.users insert.
          {
            echo "BEGIN;"
            echo "SET session_replication_role = 'replica';"
            # Drop both schemas; pg_dump's output recreates them. We used
            # to also pre-`CREATE SCHEMA public; CREATE SCHEMA auth;` here
            # so search_path resolution in the dump body would land on the
            # new schemas — but the dump body itself contains
            # `CREATE SCHEMA public;` / `CREATE SCHEMA auth;` and a
            # pre-create + dump's create races into "schema already exists"
            # under ON_ERROR_STOP. Let the dump own schema creation.
            echo "DROP SCHEMA IF EXISTS public CASCADE;"
            echo "DROP SCHEMA IF EXISTS auth CASCADE;"
            # pg_dump 17 emits constructs that pre-17 servers (e.g. stage's
            # supabase/postgres:15.1.1.78) reject and abort restore on:
            #   - `\restrict <tag>` / `\unrestrict <tag>` psql metacommands
            #     (added 17.5 for CVE-2025-1094 search-path mitigation)
            #   - `SET transaction_timeout = N;` (GUC added in pg 17)
            # Strip both kinds. They're either purely client-side or
            # session-scoped and don't affect the dump's data integrity.
            # If/when stage moves to pg 17, this filter can be removed.
            pg_dump "$PROD_DATABASE_URL" \
              --no-owner \
              --no-privileges \
              --no-comments \
              --schema=public \
              --schema=auth \
              | grep -vE '^\\(restrict|unrestrict) |^SET transaction_timeout '
            echo "UPDATE auth.users SET"
            echo "  confirmation_token = COALESCE(confirmation_token, ''),"
            echo "  recovery_token = COALESCE(recovery_token, ''),"
            echo "  email_change_token_new = COALESCE(email_change_token_new, ''),"
            echo "  email_change = COALESCE(email_change, ''),"
            echo "  email_change_token_current = COALESCE(email_change_token_current, ''),"
            echo "  phone_change = COALESCE(phone_change, ''),"
            echo "  phone_change_token = COALESCE(phone_change_token, ''),"
            echo "  reauthentication_token = COALESCE(reauthentication_token, '');"
            # pg_dump --no-owner sets ownership of restored objects to
            # whoever runs the SQL (supabase_admin in this script). gotrue's
            # first-boot migration runs `comment on table auth.users` which
            # requires ownership of those tables — fails as supabase_auth_admin
            # because supabase_admin owns everything. Reassign auth schema +
            # all its tables/sequences/functions to supabase_auth_admin.
            echo "ALTER SCHEMA auth OWNER TO supabase_auth_admin;"
            echo "DO \$do\$ DECLARE r record; BEGIN"
            echo "  FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'auth' LOOP"
            echo "    EXECUTE 'ALTER TABLE auth.' || quote_ident(r.tablename) || ' OWNER TO supabase_auth_admin';"
            echo "  END LOOP;"
            echo "  FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = 'auth' LOOP"
            echo "    EXECUTE 'ALTER SEQUENCE auth.' || quote_ident(r.sequence_name) || ' OWNER TO supabase_auth_admin';"
            echo "  END LOOP;"
            echo "  FOR r IN SELECT routine_name FROM information_schema.routines WHERE routine_schema = 'auth' AND routine_type = 'FUNCTION' LOOP"
            echo "    EXECUTE 'ALTER FUNCTION auth.' || quote_ident(r.routine_name) || ' OWNER TO supabase_auth_admin';"
            echo "  END LOOP;"
            echo "END \$do\$;"
            # pg_dump --no-privileges strips GRANTs (we use it to avoid
            # GRANTing to prod-only roles that don't exist on stage). But
            # gotrue + postgrest need the standard supabase grants on the
            # restored schemas to function. Re-apply them by hand.
            echo "GRANT USAGE, CREATE ON SCHEMA auth TO supabase_auth_admin;"
            echo "GRANT ALL ON ALL TABLES IN SCHEMA auth TO supabase_auth_admin;"
            echo "GRANT ALL ON ALL SEQUENCES IN SCHEMA auth TO supabase_auth_admin;"
            echo "GRANT ALL ON ALL FUNCTIONS IN SCHEMA auth TO supabase_auth_admin;"
            echo "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;"
            echo "GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;"
            echo "GRANT SELECT ON ALL TABLES IN SCHEMA public TO anon, authenticated;"
            echo "GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;"
            echo "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role;"
            echo "SET session_replication_role = 'origin';"
            echo "COMMIT;"
          } | ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
              "${SSH_USER}@${HOST}" \
              "docker exec -i -e PGPASSWORD='${PREVIEW_POSTGRES_PASSWORD}' \
                'stage-${APP_NAME}-db' \
                psql -U supabase_admin -h 127.0.0.1 -d postgres \
                -v ON_ERROR_STOP=1 -q"

          echo "::notice::synced prod into stage-${APP_NAME}"

      - name: Restart stage-auth + stage-rest (schema changed)
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          # PostgREST caches the schema cache at startup. After we replaced
          # public.* it has stale metadata. Restart it. Same for gotrue,
          # since auth.* was dropped+recreated.
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "docker restart 'stage-${APP_NAME}-rest' 'stage-${APP_NAME}-auth' || true"
