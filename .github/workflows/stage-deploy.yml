name: Stage deploy

# Reusable workflow that builds + deploys the persistent staging environment
# for an app. Triggered by the caller on push to main (and via
# workflow_dispatch). Brings up `stage-{app}` compose project on the LXC,
# rendering /opt/stage/{app}/{compose.yml,.env,kong.yml,init-roles.sh} from
# the templates in `stage/` of the app's repo.
#
# Stage is a SANDBOX: data persists across deploys (named volume), refreshed
# from prod only via stage-data-sync.yml (manual / cron). Per-PR previews
# share stage's supabase stack so PRs see prod-like data while their own
# `web` is the only per-PR moving piece.
#
# Migrations: drizzle/*.sql is applied to stage's DB BEFORE the new web
# container starts, so a main-branch merge that includes a schema change
# brings stage forward atomically with the code.

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      app-domain:
        type: string
        required: true
      node-version:
        type: string
        required: false
        default: '22'
      sops-stage-env-file:
        description: >-
          Path to SOPS-encrypted dotenv with stage's runtime secrets. The
          workflow extracts POSTGRES_PASSWORD (from DATABASE_URL),
          JWT_SECRET, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
          NEXT_PUBLIC_SENTRY_DSN, RESEND_API_KEY and renders compose +
          .env templates with them.
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      SOPS_AGE_KEY:
        description: age private key for decrypting sops-stage-env-file.
        required: true

permissions:
  contents: read
  packages: write

# One stage deploy at a time per app — never two main-branch merges
# applying conflicting migrations to the same DB.
concurrency:
  group: stage-deploy-${{ inputs.app-name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: stage
    steps:
      - uses: actions/checkout@v4

      - uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-stage-env-file }}
          output-file: /tmp/sops.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Source build-time secrets to GITHUB_ENV
        # NEXT_PUBLIC_SUPABASE_ANON_KEY + NEXT_PUBLIC_SENTRY_DSN come from
        # the encrypted file. Mask + propagate.
        run: |
          for key in NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SENTRY_DSN; do
            val=$(grep "^${key}=" /tmp/sops.env | cut -d= -f2-)
            echo "::add-mask::${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done

      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:stage
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://stage.${{ inputs.app-domain }}/supabase
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=stage
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:buildcache
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: migrate
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:stage-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-stage-env-file }}
          output-file: /tmp/sops.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Source render-time secrets from SOPS
        # Pass every key from the decrypted sops file through to
        # $GITHUB_ENV so app-specific .env.template placeholders
        # (BRIDGE_URL, FAL_API_KEY, MESHY_API_KEY, ASSET_GALLERY_ENABLED,
        # any future app env) reach envsubst without each new key
        # requiring a ci-templates edit. The 6 keys this step used to
        # hand-extract are still validated explicitly; that's the
        # backwards-compatible bare minimum for any app deploying
        # via this workflow.
        #
        # POSTGRES_PASSWORD is derived from DATABASE_URL (the sops
        # file doesn't store it standalone) and emitted as an extra
        # GITHUB_ENV key the templates can reference as ${POSTGRES_PASSWORD}.
        #
        # SOPS_PASSTHROUGH_KEYS captures the names of every sops key
        # for the envsubst VARS list in the next step.
        run: |
          set -euo pipefail
          db_url=$(grep '^DATABASE_URL=' /tmp/sops.env | cut -d= -f2-)
          pg_pass=$(printf '%s' "$db_url" | sed -E 's|^postgres(ql)?://[^:]+:([^@]+)@.*$|\2|')
          jwt=$(grep '^JWT_SECRET=' /tmp/sops.env | cut -d= -f2-)
          anon=$(grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' /tmp/sops.env | cut -d= -f2-)
          srv=$(grep '^SUPABASE_SERVICE_ROLE_KEY=' /tmp/sops.env | cut -d= -f2-)
          for v in "$pg_pass" "$jwt" "$anon" "$srv"; do
            [ -z "$v" ] && { echo "::error::missing required secret in SOPS file"; exit 1; }
          done
          for v in "$pg_pass" "$jwt" "$anon" "$srv"; do
            [ -n "$v" ] && echo "::add-mask::${v}"
          done

          # Emit POSTGRES_PASSWORD (derived) + the alias ANON_KEY /
          # SERVICE_ROLE_KEY (envsubst expects those names, but sops
          # has NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY).
          {
            echo "POSTGRES_PASSWORD=${pg_pass}"
            echo "ANON_KEY=${anon}"
            echo "SERVICE_ROLE_KEY=${srv}"
          } >> "$GITHUB_ENV"

          # Pass through every other key verbatim. Skips blanks, comments,
          # malformed lines. Mask any value 8 chars or longer that isn't
          # a trivial boolean / flag — covers URLs, tokens, secrets without
          # caring about which is which.
          passthrough_names=""
          while IFS='=' read -r key val; do
            [ -z "$key" ] && continue
            case "$key" in
              \#*) continue ;;
            esac
            case "$val" in
              true|false|0|1|yes|no) ;;
              *)
                if [ ${#val} -ge 8 ]; then
                  echo "::add-mask::${val}"
                fi
                ;;
            esac
            # Heredoc so values containing = or # survive into GITHUB_ENV.
            {
              printf '%s<<__SOPS_EOF__\n' "$key"
              printf '%s\n' "$val"
              printf '__SOPS_EOF__\n'
            } >> "$GITHUB_ENV"
            passthrough_names="${passthrough_names} \$${key}"
          done < /tmp/sops.env
          echo "SOPS_PASSTHROUGH_VARS=${passthrough_names}" >> "$GITHUB_ENV"

          rm /tmp/sops.env

      - name: Render compose + .env + kong.yml from templates
        # The previous step echoed every sops key into $GITHUB_ENV.
        # envsubst's VARS list combines the well-known names (APP_NAME,
        # APP_DOMAIN, GHCR_OWNER) with the SOPS_PASSTHROUGH_VARS list
        # assembled in the previous step — so any new key landed in sops
        # automatically reaches envsubst on the next deploy. No more
        # silent-empty placeholders.
        env:
          APP_NAME: ${{ inputs.app-name }}
          APP_DOMAIN: ${{ inputs.app-domain }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for f in stage/compose.template.yml stage/.env.template stage/kong.template.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing in repo. Copy from app-template's stage/."
              exit 1
            fi
          done
          mkdir -p rendered
          VARS="\$APP_NAME \$APP_DOMAIN \$GHCR_OWNER${SOPS_PASSTHROUGH_VARS} \$POSTGRES_PASSWORD \$ANON_KEY \$SERVICE_ROLE_KEY"
          envsubst "$VARS" < stage/compose.template.yml > rendered/compose.yml
          envsubst "$VARS" < stage/.env.template        > rendered/.env
          envsubst "$VARS" < stage/kong.template.yml    > rendered/kong.yml
          if [ -f stage/init-roles.sh ]; then
            cp stage/init-roles.sh rendered/init-roles.sh
            chmod +x rendered/init-roles.sh
          fi

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ship templates + bring stage up
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
          # Remote GHCR login with the run's ephemeral token. The LXC used
          # to rely on a long-lived PAT baked into ~/.docker/config.json —
          # it expired in June 2026 and every pull started failing with
          # `error from registry: denied`. Logging in per-deploy means
          # there is no credential to rot.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE_DIR="/opt/stage/${APP_NAME}"
          # NO `down -v` here — we want stage's DB to persist across deploys.
          # `up -d --wait` is enough: compose detects services that need to be
          # recreated (image changed → web), leaves db/auth/rest alone if
          # their config didn't change.
          FILES="compose.yml .env kong.yml"
          [ -f rendered/init-roles.sh ] && FILES="$FILES init-roles.sh"
          tar -C rendered -cf - $FILES | \
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail; \
             mkdir -p '${STAGE_DIR}'; \
             tar -C '${STAGE_DIR}' -xf -; \
             chmod 600 '${STAGE_DIR}/.env'; \
             cd '${STAGE_DIR}'; \
             printf %s '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin >/dev/null; \
             docker compose -p 'stage-${APP_NAME}' pull --quiet; \
             docker compose -p 'stage-${APP_NAME}' up -d --wait --wait-timeout 240; \
             docker image prune -f"

      - name: Apply migrations against stage DB
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # Run the :stage-migrate image against stage's db. The migrate
          # container's DATABASE_URL inside the stage stack already points at
          # the local postgres via `db:5432` (env_file ./.env on the migrate
          # service when it's defined inline). Here we run as a one-off
          # against the same network so it reaches `db`.
          #
          # `docker pull` first — `docker run` would otherwise reuse the
          # locally-cached image even when GHCR has a newer manifest under
          # the same `:stage-migrate` tag. Without this, an app that
          # changes its migrate target (e.g. drizzle-kit → psql) keeps
          # running the previous build until someone manually clears the
          # cached image on the host.
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "printf %s '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin >/dev/null && \
             cd /opt/stage/${APP_NAME} && \
             docker pull 'ghcr.io/${GHCR_OWNER}/${APP_NAME}:stage-migrate' && \
             docker run --rm \
               --network stage-${APP_NAME}_default \
               --env-file .env \
               'ghcr.io/${GHCR_OWNER}/${APP_NAME}:stage-migrate'"
