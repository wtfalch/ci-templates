name: PR preview build & deploy

# Reusable workflow that builds a per-PR Docker image, pushes it to GHCR with
# a `pr-{N}` tag, SSHes to the deploy host, brings up an isolated compose
# project (`pr-{N}`) with a per-PR self-hosted Supabase stack
# (postgres + gotrue + postgrest + kong + inbucket + migrate + the app),
# and posts the preview URL on the PR. Routing is done by a host-level
# Caddy singleton (provisioned at bootstrap) reading container labels —
# this workflow does not touch DNS or Caddy directly.
#
# JWT keys (anon + service_role) are derived once at bootstrap from a shared
# PREVIEW_JWT_SECRET and stored as repo secrets; they're constants across all
# previews of an app. OAuth providers cannot be wildcarded to preview URLs,
# so previews support magic-link auth only (mail caught by the per-PR
# inbucket container).

on:
  workflow_call:
    inputs:
      app-name:
        description: App slug — used for the GHCR image name and the LXC compose project root.
        type: string
        required: true
      app-domain:
        description: Public app domain (e.g. myapp.example.com). Preview URL is pr-{N}-preview.{app-domain}.
        type: string
        required: true
      node-version:
        type: string
        required: false
        default: '22'
      sops-stage-env-file:
        description: >-
          Path to SOPS-encrypted dotenv with stage-shared runtime secrets.
          Per-PR previews share stage's backend, so they consume the same
          values (POSTGRES_PASSWORD via DATABASE_URL, JWT_SECRET, anon/service
          role keys, Sentry, Resend).
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      SOPS_AGE_KEY:
        description: age private key for decrypting sops-stage-env-file.
        required: true

permissions:
  contents: read
  packages: write
  pull-requests: write

# Per-PR concurrency: a new push to the PR cancels the in-flight build.
# Different PRs build in parallel.
concurrency:
  group: pr-preview-${{ inputs.app-name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: wtfalch/ci-templates/.github/workflows/lint-typecheck.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      run-e2e: false

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-stage-env-file }}
          output-file: /tmp/sops.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Source build-time secrets to GITHUB_ENV
        run: |
          for key in NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SENTRY_DSN; do
            val=$(grep "^${key}=" /tmp/sops.env | cut -d= -f2-)
            echo "::add-mask::${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done

      # NEXT_PUBLIC_SUPABASE_URL points at /supabase under the SAME hostname
      # as the app — Caddy strips that prefix and proxies to kong. Single
      # origin keeps requests same-origin (Cloudflare Access cookie is host-
      # only, so a separate -api subdomain would drop the cookie on cross-
      # origin fetch, breaking auth). The anon key is constant across
      # previews (signed once at bootstrap with PREVIEW_JWT_SECRET).
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://pr-${{ github.event.pull_request.number }}-preview.${{ inputs.app-domain }}/supabase
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=preview-pr-${{ github.event.pull_request.number }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:buildcache
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Migrate image is built only by stage-deploy.yml — per-PR previews
      # share stage's DB and don't apply schema changes themselves. PRs that
      # add new SQL files: until phase-4 mutex lands, label them `no-preview`
      # OR run them through the stage-deploy on merge to main, which will
      # apply migrations to stage as part of its deploy.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute URL
        id: url
        run: echo "url=https://pr-${{ github.event.pull_request.number }}-preview.${{ inputs.app-domain }}" >> "$GITHUB_OUTPUT"

      - uses: wtfalch/ci-templates/.github/actions/decrypt-secrets@main
        with:
          env-file: ${{ inputs.sops-stage-env-file }}
          output-file: /tmp/sops.env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Source render-time secrets from SOPS
        run: |
          db_url=$(grep '^DATABASE_URL=' /tmp/sops.env | cut -d= -f2-)
          pg_pass=$(printf '%s' "$db_url" | sed -E 's|^postgres(ql)?://[^:]+:([^@]+)@.*$|\2|')
          anon=$(grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' /tmp/sops.env | cut -d= -f2-)
          srv=$(grep '^SUPABASE_SERVICE_ROLE_KEY=' /tmp/sops.env | cut -d= -f2-)
          dsn=$(grep '^NEXT_PUBLIC_SENTRY_DSN=' /tmp/sops.env | cut -d= -f2-)
          resend=$(grep '^RESEND_API_KEY=' /tmp/sops.env | cut -d= -f2-)
          # BRIDGE_URL is OPTIONAL — only apps with a Claude-bridge-style
          # daemon (e.g. lokessmie) set it. Apps without one leave the key
          # absent from SOPS and the preview .env template; envsubst leaves
          # the unreferenced variable alone.
          bridge_url=$(grep '^BRIDGE_URL=' /tmp/sops.env | cut -d= -f2- || true)
          for v in "$pg_pass" "$anon" "$srv"; do
            [ -z "$v" ] && { echo "::error::missing required secret in SOPS file"; exit 1; }
          done
          for v in "$pg_pass" "$anon" "$srv" "$dsn" "$resend" "$bridge_url"; do
            [ -n "$v" ] && echo "::add-mask::${v}"
          done
          {
            echo "POSTGRES_PASSWORD=${pg_pass}"
            echo "ANON_KEY=${anon}"
            echo "SERVICE_ROLE_KEY=${srv}"
            echo "NEXT_PUBLIC_SENTRY_DSN=${dsn}"
            echo "RESEND_API_TOKEN=${resend}"
            echo "BRIDGE_URL=${bridge_url}"
          } >> "$GITHUB_ENV"
          rm /tmp/sops.env

      - name: Render compose + .env from templates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: ${{ inputs.app-name }}
          APP_DOMAIN: ${{ inputs.app-domain }}
          GHCR_OWNER: ${{ github.repository_owner }}
          ANON_KEY: ${{ env.ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          # Stage and per-PR previews share a Postgres password (the per-PR
          # web container connects directly to stage-${APP_NAME}-db over
          # `pr-shared` for Drizzle / postgres-js queries that bypass kong).
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.NEXT_PUBLIC_SENTRY_DSN }}
          RESEND_API_TOKEN: ${{ env.RESEND_API_TOKEN }}
          BRIDGE_URL: ${{ env.BRIDGE_URL }}
        run: |
          set -euo pipefail
          for f in preview/compose.template.yml preview/.env.template; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing in repo. Re-run bootstrap or copy from app-template."
              exit 1
            fi
          done
          mkdir -p rendered
          # Per-PR previews share stage's supabase stack. POSTGRES_PASSWORD is
          # threaded so DATABASE_URL in preview/.env can hit stage's db
          # directly. JWT_SECRET stays per-stage-only.
          VARS='$PR_NUMBER $APP_NAME $APP_DOMAIN $GHCR_OWNER $ANON_KEY $SERVICE_ROLE_KEY $POSTGRES_PASSWORD $NEXT_PUBLIC_SENTRY_DSN $RESEND_API_TOKEN $BRIDGE_URL'
          envsubst "$VARS" < preview/compose.template.yml > rendered/compose.yml
          envsubst "$VARS" < preview/.env.template        > rendered/.env

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ship templates + bring up compose
        id: bring-up
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PREVIEW_DIR="/opt/previews/${APP_NAME}/pr-${PR_NUMBER}"
          # Per-PR is now just `compose.yml` + `.env`. No kong.yml /
          # init-roles.sh — those live with the persistent stage stack at
          # /opt/stage/${APP_NAME}/.
          tar -C rendered -cf - compose.yml .env | \
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail; \
             mkdir -p '${PREVIEW_DIR}'; \
             tar -C '${PREVIEW_DIR}' -xf -; \
             chmod 600 '${PREVIEW_DIR}/.env'; \
             cd '${PREVIEW_DIR}'; \
             docker compose -p 'pr-${PR_NUMBER}' down -v --remove-orphans 2>/dev/null || true; \
             docker compose -p 'pr-${PR_NUMBER}' pull --quiet; \
             docker compose -p 'pr-${PR_NUMBER}' up -d --wait --wait-timeout 240; \
             docker image prune -f"

      - name: Capture container logs on failure
        if: failure() && steps.bring-up.outcome == 'failure'
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Grab logs from the per-PR migrate + db containers so we can
          # diagnose without SSHing manually. Best-effort — never fails the
          # workflow further than it already has.
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "echo '=== migrate logs ==='; \
             docker compose -p 'pr-${PR_NUMBER}' logs migrate 2>&1 || true; \
             echo; echo '=== db logs (last 100) ==='; \
             docker compose -p 'pr-${PR_NUMBER}' logs db --tail 100 2>&1 || true; \
             echo; echo '=== compose ps ==='; \
             docker compose -p 'pr-${PR_NUMBER}' ps -a 2>&1 || true" || true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- pr-preview-bot -->';
            const body = `${marker}\n\n**Preview ready** → ${process.env.PREVIEW_URL}\n\n_Updated on every push. Add the \`no-preview\` label to disable; close or merge to tear down._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
