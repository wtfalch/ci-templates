name: PR preview build & deploy

# Reusable workflow that builds a per-PR Docker image, pushes it to GHCR with
# a `pr-{N}` tag, SSHes to the deploy host, brings up an isolated compose
# project (`pr-{N}`) with a per-PR self-hosted Supabase stack
# (postgres + gotrue + postgrest + kong + inbucket + migrate + the app),
# and posts the preview URL on the PR. Routing is done by a host-level
# Caddy singleton (provisioned at bootstrap) reading container labels —
# this workflow does not touch DNS or Caddy directly.
#
# JWT keys (anon + service_role) are derived once at bootstrap from a shared
# PREVIEW_JWT_SECRET and stored as repo secrets; they're constants across all
# previews of an app. OAuth providers cannot be wildcarded to preview URLs,
# so previews support magic-link auth only (mail caught by the per-PR
# inbucket container).

on:
  workflow_call:
    inputs:
      app-name:
        description: App slug — used for the GHCR image name and the LXC compose project root.
        type: string
        required: true
      app-domain:
        description: Public app domain (e.g. myapp.example.com). Preview URL is pr-{N}.preview.{app-domain}.
        type: string
        required: true
      node-version:
        type: string
        required: false
        default: '22'
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      PREVIEW_POSTGRES_PASSWORD:
        description: |
          Static password used inside the per-PR Postgres container. Not exposed
          to the public internet; the DB binds only to the per-PR docker network.
          Set once per app via gh-secrets.
        required: true
      PREVIEW_JWT_SECRET:
        description: |
          Shared HS256 JWT secret for the per-PR GoTrue + PostgREST. ≥32 chars.
          All previews of this app share the same secret (so anon/service keys
          are constant across PRs); per-PR isolation comes from network
          namespacing, not key rotation. Set once at bootstrap.
        required: true
      PREVIEW_ANON_KEY:
        description: HS256 JWT pre-signed with PREVIEW_JWT_SECRET, role=anon, exp far in the future.
        required: true
      PREVIEW_SERVICE_ROLE_KEY:
        description: Same as PREVIEW_ANON_KEY but role=service_role.
        required: true

permissions:
  contents: read
  packages: write
  pull-requests: write

# Per-PR concurrency: a new push to the PR cancels the in-flight build.
# Different PRs build in parallel.
concurrency:
  group: pr-preview-${{ inputs.app-name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: wtfalch/ci-templates/.github/workflows/lint-typecheck.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      run-e2e: false

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_SUPABASE_URL points at the per-PR Kong gateway (a separate
      # wildcard subdomain so the supabase-js client can reach it from the
      # browser). The anon key is constant across previews (signed once at
      # bootstrap with PREVIEW_JWT_SECRET).
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://pr-${{ github.event.pull_request.number }}-api.preview.${{ inputs.app-domain }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PREVIEW_ANON_KEY }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:buildcache
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: migrate
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:${{ steps.tag.outputs.tag }}-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute URL
        id: url
        run: echo "url=https://pr-${{ github.event.pull_request.number }}.preview.${{ inputs.app-domain }}" >> "$GITHUB_OUTPUT"

      - name: Render compose + .env + kong.yml from templates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: ${{ inputs.app-name }}
          APP_DOMAIN: ${{ inputs.app-domain }}
          GHCR_OWNER: ${{ github.repository_owner }}
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
          ANON_KEY: ${{ secrets.PREVIEW_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for f in preview/compose.template.yml preview/.env.template preview/kong.template.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing in repo. Re-run bootstrap or copy from app-template."
              exit 1
            fi
          done
          mkdir -p rendered
          # Pass an explicit allowlist to envsubst so $VAR references in comment
          # text (or service env values that mention $VAR_THE_CONTAINER_READS)
          # don't get substituted away to empty strings.
          VARS='$PR_NUMBER $APP_NAME $APP_DOMAIN $GHCR_OWNER $POSTGRES_PASSWORD $JWT_SECRET $ANON_KEY $SERVICE_ROLE_KEY'
          envsubst "$VARS" < preview/compose.template.yml > rendered/compose.yml
          envsubst "$VARS" < preview/.env.template        > rendered/.env
          envsubst "$VARS" < preview/kong.template.yml    > rendered/kong.yml

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ship templates + bring up compose
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_NAME: ${{ inputs.app-name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PREVIEW_DIR="/opt/previews/${APP_NAME}/pr-${PR_NUMBER}"
          # Single SSH session: tar the rendered files via stdin, run docker compose.
          # cloudflared access ssh adds ~2 s of handshake — folding into one call
          # avoids paying that 3×.
          tar -C rendered -cf - compose.yml .env kong.yml | \
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id ${CF_ID} --secret ${CF_SECRET}" \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail; \
             mkdir -p '${PREVIEW_DIR}'; \
             tar -C '${PREVIEW_DIR}' -xf -; \
             chmod 600 '${PREVIEW_DIR}/.env'; \
             cd '${PREVIEW_DIR}'; \
             docker compose -p 'pr-${PR_NUMBER}' pull --quiet; \
             docker compose -p 'pr-${PR_NUMBER}' up -d --wait --wait-timeout 240; \
             docker image prune -f"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- pr-preview-bot -->';
            const body = `${marker}\n\n**Preview ready** → ${process.env.PREVIEW_URL}\n\n_Updated on every push. Add the \`no-preview\` label to disable; close or merge to tear down._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
