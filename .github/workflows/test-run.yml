name: assay test run

# Runs a repository's `.assay.yml`: validate it, expand its matrix, and run each
# job inside the lane image the manifest asked for.
#
# The workflow deliberately knows almost nothing. It does not know what a lane
# is, how a matrix expands, or how `${{ matrix.x }}` is substituted — it asks
# the `assay` CLI, which ships inside a published image. Every rule that lives
# in YAML is a rule that has to be reimplemented when the same manifest runs
# somewhere that is not GitHub Actions, and reimplemented rules drift.
#
# Usage, in a calling repository:
#
#   jobs:
#     e2e:
#       permissions:
#         contents: read
#         packages: read      # REQUIRED — see below
#       uses: wtfalch/ci-templates/.github/workflows/test-run.yml@main
#       secrets: inherit
#
# `packages: read` is not optional and not obvious. This workflow pulls private
# images with the caller's token, and a called workflow cannot request more
# permission than its caller holds. Omit it and GitHub refuses the run before
# any job starts, reporting "this run likely failed because of a workflow file
# issue" — with no jobs, no check runs and no log. The YAML is fine; the
# permission is missing, and nothing in that message says so.
#
# `secrets: inherit` only matters if the manifest declares any under `secrets:`;
# a manifest that declares none needs no secrets line at all.
#
# The images this pulls are PRIVATE, and a calling repository needs pull access
# granted on EACH of them: package settings → Manage Actions access → add
# repository, role Read. There are always two, and forgetting the first is the
# easy mistake because it is not the one the manifest names:
#
#   assay-cli            every job — validate, resolve, ingest, report
#   assay-<the lane>     the `run` job only, e.g. assay-linux,
#                        assay-linux-browsers, assay-linux-gui
#
# Without a grant the pull fails with `docker: Error response from daemon:
# denied`, which names neither the image nor the permission. The step below
# prints which image it is about to pull, so the log at least says what to go
# and grant.

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the manifest, relative to the repository root.
        type: string
        default: .assay.yml
      cli-image:
        description: >-
          The image holding the assay CLI. Pin this to a digest in anything
          that matters; `latest` is a convenience, not a guarantee.
        type: string
        default: ghcr.io/wtfalch/assay-cli:latest
      lane-image-registry:
        description: >-
          Registry and namespace only, with a trailing slash. The image name
          and tag come from the manifest, via `assay resolve` — this is the one
          part of the reference the pipeline does not know.
        type: string
        default: ghcr.io/wtfalch/

permissions:
  contents: read
  packages: read

jobs:
  # Validate once, before any lane image is pulled. A manifest with a bad path
  # or a leaked credential should cost seconds, not the two minutes it takes to
  # fetch three browser engines.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.expand.outputs.jobs }}
      lane: ${{ steps.expand.outputs.lane }}
      runs-on: ${{ steps.expand.outputs.runs-on }}
      scope: ${{ steps.expand.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      # The lane and cli images are private, published from a private
      # repository. A caller reaches them with its own GITHUB_TOKEN once the
      # package grants that repository pull access (package settings → Manage
      # Actions access → add repository, role Read). Nothing here is public.
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: is this manifest runnable
        shell: bash
        run: |
          # Named before it is pulled, because `denied` does not say which
          # image it was denied.
          echo "using ${{ inputs.cli-image }}"
          docker run --rm -v "$PWD:/w" -w /w "${{ inputs.cli-image }}" \
            validate "${{ inputs.manifest }}"

      - id: expand
        name: what does it expand to
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(docker run --rm -v "$PWD:/w" -w /w "${{ inputs.cli-image }}" \
            expand "${{ inputs.manifest }}")"

          # Every combination is resolved HERE, on Linux, and carried to the
          # run jobs as a map.
          #
          # Not an optimisation — a necessity. `assay-cli` is a Linux image and
          # a Windows runner cannot run Linux containers, so a `windows` job
          # has no way to ask the CLI anything. Resolving up front means the
          # run job needs no CLI at all: it reads its own entry and executes.
          #
          # Keyed by the combination itself, compact and sorted, so the run job
          # can compute the same key from `matrix.combination` without an index
          # or a label to keep in step.
          resolved='{}'
          while read -r combo; do
            [ -n "$combo" ] || continue
            one="$(docker run --rm -v "$PWD:/w" -w /w "${{ inputs.cli-image }}" \
              resolve "${{ inputs.manifest }}" "$combo")"
            key="$(printf '%s' "$combo" | jq -cS .)"
            resolved="$(jq -c --arg k "$key" --argjson v "$one" '. + {($k): $v}' <<<"$resolved")"
          done < <(printf '%s' "$jobs" | jq -c '.[]')

          first="$(printf '%s' "$resolved" | jq -c 'to_entries[0].value')"
          lane="$(printf '%s' "$first" | jq -r .lane)"

          # Which machine the run jobs need. A container lane runs its image on
          # Linux; a runner lane asks for the machine the lane names, because
          # no image would help.
          if [ "$(printf '%s' "$first" | jq -r .execution)" = "runner" ]; then
            runs_on="$(printf '%s' "$first" | jq -r .runsOn)"
          else
            runs_on="ubuntu-latest"
          fi

          # Everything this run writes is named after the manifest, because a
          # repository may call this workflow more than once in one run — one
          # manifest per lane is the shape a second operating system takes.
          #
          # Without it two callers share an artifact namespace and a cache key,
          # and the failure is silent and wrong rather than loud: the second
          # upload collides, the second report downloads the FIRST caller's
          # results, and a green Windows report describes a Linux run. Measured
          # on tf-web the first time it had two manifests.
          scope="$(printf '%s' "${{ inputs.manifest }}" | tr -c 'A-Za-z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g')"

          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'jobs=%s\n' "$jobs" >> "$GITHUB_OUTPUT"
          printf 'lane=%s\n' "$lane" >> "$GITHUB_OUTPUT"
          printf 'runs-on=%s\n' "$runs_on" >> "$GITHUB_OUTPUT"
          # NOT a job output. GitHub secret-scans outputs and silently SKIPS
          # any that appear to contain a secret value — and a resolved manifest
          # carries the consumer's `env`, so a value that happens to match one
          # of their secrets (a test database password of `postgres`, say)
          # makes the whole output vanish. The plan job then passes, the run
          # job reads an empty string, and `jq -e` exits 4 with nothing to say.
          #
          # An artifact is not scanned and not truncated, and it survives the
          # trip to a Windows runner, which a file in /tmp would not.
          printf '%s' "$resolved" > resolved.json
          printf '%s on lane %s, running on %s\n' \
            "$(printf '%s' "$jobs" | jq length) job(s)" "$lane" "$runs_on" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: hand the resolved jobs to the run jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.expand.outputs.scope }}-plan
          path: resolved.json
          retention-days: 1

  run:
    needs: plan
    # Decided by the manifest, not by this file. A container lane lands on
    # Linux; a runner lane lands on whatever machine it named.
    runs-on: ${{ needs.plan.outputs.runs-on }}
    timeout-minutes: 60
    strategy:
      # One combination failing must not cancel the others. A matrix where
      # webkit fails and chromium passes is a result worth having; three
      # cancelled jobs is a re-run.
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4

      # The lane and cli images are private, published from a private
      # repository. A caller reaches them with its own GITHUB_TOKEN once the
      # package grants that repository pull access (package settings → Manage
      # Actions access → add repository, role Read). Nothing here is public.
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The resolved job: the command with `${{ matrix.x }}` already
      # substituted, and the service list, timeouts and result paths beside it.
      # Written to a file rather than an output so nothing passes through
      # GitHub's own `${{ }}` interpolation — a manifest command legitimately
      # contains that syntax, and Actions would eat it.
      # Already resolved, in the plan job, on Linux. This step only picks this
      # combination's entry out of the map — no CLI, no container, and
      # therefore nothing that a Windows runner cannot do.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.scope }}-plan
          path: .

      - name: this combination's job
        shell: bash
        env:
          COMBINATION: ${{ toJSON(matrix.combination) }}
        run: |
          set -euo pipefail
          key="$(printf '%s' "$COMBINATION" | jq -cS .)"
          # `jq -e` exits non-zero when the key is absent, which is the whole
          # guard: a combination with no resolved entry is a bug here, not a
          # job to run with an empty config.
          jq -e --arg k "$key" '.[$k]' resolved.json > /tmp/job.json
          jq -r '"lane=\(.lane)  execution=\(.execution)  timeout=\(.timeout)s"' /tmp/job.json

      # Secrets arrive wholesale through `secrets: inherit` and are filtered
      # here down to the names the manifest declares. That is safe because the
      # caller and the secrets are the same repository — the paid tier resolves
      # from a per-tenant vault instead, and never inherits anything.
      #
      # Written to a file with restrictive permissions rather than passed as
      # `-e NAME=value`, which would put every value in the process list.
      - name: collect the declared secrets
        shell: bash
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          umask 077
          : > /tmp/job.env
          for name in $(jq -r '.secrets[]' /tmp/job.json); do
            value="$(printf '%s' "$ALL_SECRETS" | jq -r --arg n "$name" '.[$n] // empty')"
            if [ -z "$value" ]; then
              printf '::error::the manifest declares secret %s and the caller did not provide it\n' "$name"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> /tmp/job.env
          done
          jq -r '.env | to_entries[] | "\(.key)=\(.value)"' /tmp/job.json >> /tmp/job.env
          printf 'CI=true\n' >> /tmp/job.env

      # Services on a user-defined network, started the same way the
      # self-hosted executor will start them. GitHub's own `services:` block
      # cannot be used: it is static YAML, and this list comes from a file that
      # does not exist until the job is running.
      - name: start the services
        # Linux containers, so container lanes only — the check is inside the
        # step because it reads the resolved job rather than anything Actions
        # can see at expression time.
        shell: bash
        run: |
          if [ "$(jq -r .execution /tmp/job.json)" != "container" ]; then
            echo "runner lane — no service containers"; exit 0
          fi
          set -euo pipefail
          docker network create assay-net >/dev/null
          jq -c '.services[]' /tmp/job.json | while read -r service; do
            image="$(printf '%s' "$service" | jq -r .image)"
            # The hostname comes from `assay resolve`, not from parsing the
            # image here. It is what the consumer puts in a connection string,
            # so it belongs in the contract — a name computed in two places is
            # a name that eventually differs.
            alias="$(printf '%s' "$service" | jq -r .name)"
            # An array, not a string: a value with a space in it splits into
            # two arguments otherwise, and the failure looks like a bad image.
            args=()
            while IFS= read -r pair; do args+=(-e "$pair"); done < <(
              printf '%s' "$service" | jq -r '.env | to_entries[] | "\(.key)=\(.value)"'
            )
            docker run -d --rm --name "$alias" --network assay-net --network-alias "$alias" \
              "${args[@]}" "$image" >/dev/null
            printf 'started %s as %s\n' "$image" "$alias"
          done

      - name: wait for the services
        shell: bash
        run: |
          if [ "$(jq -r .execution /tmp/job.json)" != "container" ]; then exit 0; fi
          set -euo pipefail
          jq -c '.services[] | select(.ready)' /tmp/job.json | while read -r service; do
            alias="$(printf '%s' "$service" | jq -r .name)"
            ready="$(printf '%s' "$service" | jq -r .ready)"
            ok=""
            for _ in $(seq 1 60); do
              if docker exec "$alias" sh -lc "$ready" >/dev/null 2>&1; then
                printf '%s is ready\n' "$alias"; ok=1; break
              fi
              sleep 2
            done
            # A service that never came up is not something to discover from a
            # connection refused two minutes into a suite. Previously this loop
            # gave up silently and let the job run against nothing.
            if [ -z "$ok" ]; then
              printf '::error::%s never became ready — `%s` did not succeed in 120s\n' "$alias" "$ready"
              docker logs "$alias" 2>&1 | tail -30
              exit 1
            fi
          done

      - name: run
        id: run
        shell: bash
        run: |
          set -euo pipefail
          # `.image` from the manifest, not a name built here. `assay resolve`
          # renders the whole name and tag — `assay-linux-browsers:pw1.59` —
          # because a lane may carry a variant and the variant is the tag.
          #
          # The input is a registry and namespace ONLY. It used to end in
          # `assay-` as well, which doubled the prefix into
          # `assay-assay-linux-browsers` and produced `manifest unknown` — a
          # valid reference to an image nobody has ever pushed, which is a
          # worse error than an invalid one because it reads as a missing
          # build.
          image="${{ inputs.lane-image-registry }}$(jq -r '.image // empty' /tmp/job.json)"
          [ -n "$(jq -r '.image // empty' /tmp/job.json)" ] && echo "using $image" || echo "no image — running on the machine"
          workdir="$(jq -r .workdir /tmp/job.json)"
          timeout="$(jq -r .timeout /tmp/job.json)"

          # setup and command as one script, so a failing install fails the job
          # for the reason it actually failed rather than as a missing binary.
          setup="$(jq -r '.setup // empty' /tmp/job.json)"
          {
            printf 'set -euo pipefail\n'
            # `if`, not `[ -n "$x" ] && ...` — that returns non-zero when the
            # manifest has no setup, and under `set -e` it takes the step with
            # it. Every manifest without a setup line would have failed here.
            if [ -n "$setup" ]; then printf '%s\n' "$setup"; fi
            jq -r .command /tmp/job.json
          } > /tmp/job.sh

          # `timeout` around docker, not docker's own --stop-timeout, which
          # only says how long to wait after asking a container to stop and
          # would let a hung job run until the runner's own limit.
          if [ "$(jq -r .execution /tmp/job.json)" = "runner" ]; then
            # No container: the machine IS the environment. The runner is
            # already clean and is destroyed after the job, which is the
            # isolation a container would have been providing.
            #
            # `timeout` is not assumed — it is coreutils and a Windows runner
            # has git bash, not coreutils. The job-level `timeout-minutes` is
            # the ceiling here instead, and the manifest's own timeout is
            # advisory on this path. Said plainly rather than pretended.
            set -a
            # shellcheck disable=SC1091
            . /tmp/job.env
            set +a
            cd "$workdir"
            bash /tmp/job.sh
            exit $?
          fi

          # As the host's user, not the image's. The workspace is a checkout
          # owned by the runner (uid 1001 on GitHub's images) and the lane
          # image's own user is uid 1000, so the container writes nothing —
          # `pnpm install` fails on permissions before a single test runs.
          # HOME comes with it, because that user does not exist in the
          # container's passwd and tools that want a home directory otherwise
          # get `/` and fail in less obvious ways.
          timeout --signal=TERM --kill-after=30 "$timeout" \
            docker run --rm \
              --network assay-net \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              --env-file /tmp/job.env \
              -v "$PWD:/workspace" \
              -v /tmp/job.sh:/tmp/job.sh:ro \
              -w "/workspace/${workdir}" \
              "$image" bash /tmp/job.sh

      # `always()`, because a failing run is exactly the one whose report
      # somebody wants to read.
      # Written into the workspace, not /tmp, and that is not a preference.
      #
      # `/tmp` means one thing to git bash on a Windows runner and another to a
      # Node action: the bash steps wrote results happily and
      # `upload-artifact` then found nothing there. It reports that as a
      # WARNING, so the job stayed green and uploaded an empty artifact — the
      # third time in this workflow that a wrong thing has been quiet rather
      # than loud.
      #
      # A workspace-relative path is resolved the same way by both.
      - name: collect the results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assay-results
          junit="$(jq -r .junit /tmp/job.json)"
          workdir="$(jq -r .workdir /tmp/job.json)"
          if [ -f "$workdir/$junit" ]; then
            cp "$workdir/$junit" assay-results/junit.xml
          elif [ "${{ steps.run.outcome }}" = "success" ]; then
            # A run that passed and produced no JUnit is a run that reported
            # nothing, and every downstream step would go quietly green on an
            # empty artifact. That is a failure, not a warning.
            printf '::error::the command succeeded but produced no %s — nothing to report on\n' "$junit"
            exit 1
          else
            # The command failed, so a missing report is a consequence rather
            # than a second problem. Say it and let the real failure stand.
            printf '::warning::no %s, and the command failed — the failure above is why\n' "$junit"
          fi
          # globstar, or `**` is just `*` and every recursive bundle pattern
          # silently collects nothing. nullglob so a pattern that matches
          # nothing disappears rather than arriving as a literal filename.
          shopt -s globstar nullglob
          while read -r pattern; do
            matches=("$workdir"/$pattern)
            if [ ${#matches[@]} -eq 0 ]; then
              printf '::warning::bundle pattern %s matched nothing\n' "$pattern"
              continue
            fi
            cp -r --parents "${matches[@]}" assay-results/ 2>/dev/null || true
          done < <(jq -r '.bundle[]' /tmp/job.json)

      - name: name this run
        if: always()
        id: label
        env:
          COMBINATION: ${{ toJSON(matrix.combination) }}
        shell: bash
        run: |
          label="$(printf '%s' "$COMBINATION" | jq -r 'to_entries | map("\(.value)") | join("-") // "default"')"
          printf 'label=%s\n' "${label:-default}" >> "$GITHUB_OUTPUT"

      # The combination travels with the results, and the ingest happens in the
      # report job.
      #
      # It used to happen here, because this is the only place that knows which
      # combination ran. That reason still holds — so the combination is
      # written next to the JUnit rather than the ingest staying. `assay-cli`
      # is a Linux image and a Windows runner cannot run Linux containers, so a
      # step here that shells into the CLI is a step that works on three lanes
      # and not the fourth.
      - name: label the results with what produced them
        if: always()
        shell: bash
        env:
          COMBINATION: ${{ toJSON(matrix.combination) }}
        run: |
          set -euo pipefail
          mkdir -p assay-results
          jq -n \
            --argjson combination "$COMBINATION" \
            --arg lane "$(jq -r .lane /tmp/job.json)" \
            --arg run "${{ github.run_id }}" \
            --arg consumer "${{ github.repository }}" \
            --arg sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            '{combination: $combination, lane: $lane, run: $run, consumer: $consumer, sha: $sha}' \
            > assay-results/context.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.plan.outputs.scope }}-${{ steps.label.outputs.label }}
          path: assay-results
          if-no-files-found: warn
          retention-days: 14

  # What the whole matrix says, which no single job can.
  #
  # A lane disagreement — one commit, one test, a different answer per lane —
  # needs nothing but this run: three engines have already produced the
  # evidence and until now nobody put the three reports side by side. Flake
  # needs history and therefore a store, which is a later decision; this job is
  # the half that is free.
  report:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.plan.outputs.scope }}-*
          path: /tmp/runs

      # Where the history lives, and why it is a cache.
      #
      # Flake is two different answers about one commit, so it cannot be seen
      # in a single run — the store is what makes the headline query possible
      # at all. What holds it had one hard constraint: the job that writes it
      # is the job that will one day run a customer's code, so it must not
      # hold a credential worth stealing or a write token for anything.
      #
      # A cache satisfies that. It needs no secret, no bucket, and no write
      # permission on the repository, and it is scoped to the calling repo so
      # one consumer's history is its own. The price is that it is a rolling
      # window and not an archive: GitHub evicts entries unused for a week, and
      # a lost cache means the history restarts rather than the run failing.
      # That is an acceptable price for a query whose evidence stops being
      # useful about when the commit does.
      #
      # `restore-keys` is what makes it a rolling store rather than a set of
      # unrelated entries: the key carries the run id so every save is a new
      # entry, and the prefix restores the most recent previous one.
      - name: the history so far
        id: history
        uses: actions/cache/restore@v4
        with:
          path: /tmp/history
          key: assay-history-${{ github.repository_id }}-${{ needs.plan.outputs.scope }}-${{ github.run_id }}
          restore-keys: assay-history-${{ github.repository_id }}-${{ needs.plan.outputs.scope }}-

      - name: read them together
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          # Ingest here, where Linux and the CLI image both exist. Each run job
          # left its JUnit and a context file saying which combination produced
          # it, which is everything `ingest` needs.
          declare -a produced=()
          for ctx in /tmp/runs/**/context.json; do
            dir="$(dirname "$ctx")"
            [ -f "$dir/junit.xml" ] || { echo "no junit.xml beside $ctx"; continue; }
            docker run --rm -v "$dir:/w" -w /w "${{ inputs.cli-image }}" \
              ingest junit.xml \
              --run "$(jq -r .run "$ctx")" \
              --consumer "$(jq -r .consumer "$ctx")" \
              --lane "$(jq -r .lane "$ctx")" \
              --sha "$(jq -r .sha "$ctx")" \
              --matrix "$(jq -c .combination "$ctx")" > "$dir/rows.json"
            produced+=("$dir/rows.json")
          done

          if [ ${#produced[@]} -eq 0 ]; then
            echo "no rows to report on" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # One array from every job's rows. `add` on an empty input is null,
          # which would then read as a file containing "null" rather than an
          # empty report, so the guard above is doing real work.
          jq -s 'add' "${produced[@]}" > /tmp/all-rows.json
          echo "$(jq length /tmp/all-rows.json) rows from ${#produced[@]} job(s)"

          # Fold this run into whatever the cache had. A missing history is an
          # empty one — the first run for a consumer, and an evicted cache, are
          # the same situation and neither is an error.
          mkdir -p /tmp/history
          docker run --rm -v /tmp:/w -w /w "${{ inputs.cli-image }}" \
            merge history/rows.json all-rows.json > /tmp/history-next.json
          mv /tmp/history-next.json /tmp/history/rows.json

          {
            echo '## assay'
            echo
            echo '```'
            docker run --rm -v /tmp:/w -w /w "${{ inputs.cli-image }}" report history/rows.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved after the report, so a run that fails to report does not poison
      # the history with rows nobody has looked at.
      - name: keep the history
        uses: actions/cache/save@v4
        with:
          path: /tmp/history
          key: assay-history-${{ github.repository_id }}-${{ needs.plan.outputs.scope }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.scope }}-rows
          path: /tmp/all-rows.json
          if-no-files-found: warn
          # Longer than the per-job bundles: these are the rows a store would
          # ingest, and they are small.
          retention-days: 90
