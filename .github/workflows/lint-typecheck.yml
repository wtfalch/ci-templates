name: Check & Test

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      run-e2e:
        type: boolean
        required: false
        default: true

# Cancel in-flight CI for a branch when a newer commit lands; we don't need
# stale runs blocking the queue. Deploys are gated separately.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, not four. Each job paid for its own checkout and install and was
# billed rounded up to a whole minute, so four parallel jobs cost about three
# times the minutes of the same steps in a row.
jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Build & Playwright e2e, behind `run-e2e`.
      - name: Cache Playwright browsers
        if: ${{ inputs.run-e2e }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Warm Next's incremental build cache between runs. Keyed on the lockfile
      # plus source so unrelated commits restore from the most recent neighbour.
      - name: Cache Next build cache
        if: ${{ inputs.run-e2e }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .next/cache
          key: nextcache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'src/**', 'pages/**', '*.config.*', 'tsconfig.json') }}
          restore-keys: |
            nextcache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextcache-${{ runner.os }}-
      - if: ${{ inputs.run-e2e }}
        run: pnpm exec playwright install --with-deps chromium
      # Stub envs so `next build` and `next start` succeed without real Supabase.
      # The home + login Playwright smoke tests don't make authenticated requests.
      # Apps that add e2e tests hitting Supabase must layer real envs in the caller.
      - if: ${{ inputs.run-e2e }}
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-build
      - if: ${{ inputs.run-e2e }}
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-build
      - if: ${{ failure() && inputs.run-e2e }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
